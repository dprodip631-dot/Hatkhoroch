<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>হাতখরচ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap">
<style>
/* Layout: one mobile column. Home = balance card, four action tiles, reminders. Bottom tabs: হোম / খরচ / আয় / রিপোর্ট / আরও. */
:root{
  --bg:#F5F2EC; --surface:#FFFFFF; --fg:#16201C; --muted:#5F6B65; --line:#E6E0D3;
  --accent:#0F766E; --on-accent:#FFFFFF; --hero:#DDEFEA; --track:#E4DFD3; --spend:#EA580C;
  --warn:#9A5A00; --danger:#B3261E;
  --c1:#0E9F83; --c2:#D98E04; --c3:#3B82C4; --c4:#C2545E; --c5:#8A6BC9; --c6:#6B8E23; --c7:#D2691E; --c8:#708090;
  --c9:#C0398F; --c10:#8D6E63; --c11:#1F7A8C;
  --font:'Hind Siliguri','Noto Sans Bengali','Kalpurush',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1613; --surface:#15221E; --fg:#E5F0EC; --muted:#95A9A2; --line:#25372F;
    --accent:#4FD1B0; --on-accent:#05211A; --hero:#14312A; --track:#24483E; --spend:#FDBA74;
    --warn:#F2B84B; --danger:#FF8A80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1613; --surface:#15221E; --fg:#E5F0EC; --muted:#95A9A2; --line:#25372F;
  --accent:#4FD1B0; --on-accent:#05211A; --hero:#14312A; --track:#24483E; --spend:#FDBA74;
  --warn:#F2B84B; --danger:#FF8A80; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font); font-size:16px; line-height:1.5;
  padding-block:12px 100px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:520px;margin-inline:auto;display:flex;flex-direction:column;gap:16px;min-width:0}
h1,h2,p{margin:0}
h1{font-size:24px;line-height:1.3;font-weight:700;text-wrap:balance}
h2{font-size:16px;font-weight:700}
.app{font-size:13px;color:var(--muted);font-weight:500;letter-spacing:.02em}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.neg{color:var(--danger)} .pos{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

.hero{background:var(--hero);border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:14px}
.hero .lbl{font-size:14px;color:var(--muted)}
.hero .big{font-size:40px;line-height:1.15;font-weight:700;color:var(--fg)}
.hero .big.neg{color:var(--danger)}
.hero{background:linear-gradient(160deg,#0F766E,#134E4A);color:#fff}
.hero .lbl,.hero .hint,.hero .st,.hero .mhead .t{color:#D5F3EE}
.hero .big{color:#fff}
.hero .num,.hero b{color:inherit}
.hero .big.neg,.hero .neg,.hero .num.neg{color:#FFB4A9}
.hero .bar{background:rgba(255,255,255,.2)}
.hero .fill{background:#5EEAD4}
.hero .near .fill{background:#FDBA74} .hero .over .fill{background:#FFB4A9}
.hero .near .st{color:#FDBA74} .hero .over .st{color:#FFB4A9}
.hero .link{color:#fff}
.meter{display:flex;flex-direction:column;gap:6px}
.mhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px;flex-wrap:wrap}
.mhead .t{font-weight:600}
.bar{height:10px;border-radius:999px;background:var(--track);overflow:hidden}
.fill{height:100%;border-radius:999px;background:var(--accent)}
.near .fill{background:var(--warn)} .over .fill{background:var(--danger)}
.near .st{color:var(--warn)} .over .st{color:var(--danger)}
.st{font-size:13px;color:var(--muted)}
.link{background:none;border:0;padding:6px 0;color:var(--accent);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px;text-align:left}

.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
label{font-size:14px;font-weight:600}
.amtrow{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;background:var(--bg)}
.amtrow:focus-within{border-color:var(--accent)}
.amtrow span{font-size:22px;color:var(--muted)}
.amtrow input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:inherit;font-size:28px;font-weight:700;padding:10px 0;outline:none}
.txt{width:100%;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);font:inherit;font-size:16px;padding:10px 14px;min-height:48px}
.txt:focus{border-color:var(--accent);outline:none}
.ta{width:100%;min-height:110px;resize:vertical;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);font-family:ui-monospace,Menlo,monospace;font-size:12px;padding:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;min-height:40px;font-size:15px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--hero);font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.primary{background:var(--accent);color:var(--on-accent);border:0;border-radius:12px;min-height:48px;padding:0 18px;font-weight:700;font-size:16px}
.ghost{background:transparent;border:1.5px solid var(--line);border-radius:12px;min-height:44px;padding:0 16px;font-weight:600}
.danger-btn{border-color:var(--danger);color:var(--danger)}
.small{min-height:44px;padding:0 14px;font-size:15px}

.sec{display:flex;flex-direction:column;gap:10px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.rmain{flex:1;min-width:0}
.rtitle{font-weight:600;overflow-wrap:anywhere}
.rsub{font-size:13px;color:var(--muted)}
.ramt{font-weight:700;white-space:nowrap}
.x{background:none;border:0;color:var(--muted);font-size:13px;padding:8px;min-height:40px;text-decoration:underline;text-underline-offset:3px}
.cat{display:flex;flex-direction:column;gap:6px;padding:8px 0}
.cat .top{display:flex;align-items:center;gap:10px}
.cat .nm{flex:1}
.cat .bar{height:6px;background:var(--line)}
.cat .fill{background:currentColor}
.pill{font-size:12px;font-weight:600;color:var(--danger);border:1px solid var(--danger);border-radius:999px;padding:1px 8px;white-space:nowrap}
.pill.ok{color:var(--accent);border-color:var(--accent)}
.row.dayrow{flex-direction:column;align-items:stretch;gap:0;padding:0}
.daybtn{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:10px 0;background:none;border:0;text-align:left}
.daybtn .rmain{display:flex;flex-direction:column}
.daybtn .chev{color:var(--muted);font-size:13px;width:16px;text-align:center}
.daysub{display:flex;flex-direction:column;gap:6px;padding:0 0 12px 12px;border-left:3px solid var(--line);margin-left:2px}
.empty{text-align:center;color:var(--muted);padding:12px 4px;display:flex;flex-direction:column;gap:10px;align-items:center}
.note{background:var(--hero);border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mnav button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:20px;line-height:1}
.mnav button:disabled{opacity:.35;cursor:default}
.two{display:grid;grid-template-columns:1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.hint{font-size:13px;color:var(--muted)}
.inl{display:flex;gap:8px;align-items:stretch}
.inl .txt{flex:1;min-width:0}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;min-height:112px;min-width:0}
.tile b{font-size:17px}
.tile .muted{font-size:13px;line-height:1.35}
.ti{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;margin-bottom:6px;border:1.5px solid currentColor}
.ti svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ti.in{color:var(--accent)} .ti.out{color:var(--danger)} .ti.fx{color:var(--warn)} .ti.rp{color:var(--c3)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;min-width:0}
.stat .k{font-size:12px;color:var(--muted)}
.stat b{font-size:15px;overflow-wrap:anywhere}
button.stat{text-align:left}
.menu{display:flex;flex-direction:column}
.mi{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.mi:first-child{border-top:0}
.mi b{display:block} .mi .sub{font-size:13px;color:var(--muted)}
.mi .go{color:var(--muted);font-size:20px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .h{font-size:12px;color:var(--muted);text-align:center}
.cd{aspect-ratio:1/1;border-radius:10px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:14px;min-width:0}
.cd.today{border-color:var(--accent);background:var(--hero);font-weight:700}
.cd.blank{border:0}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
svg.chart{width:100%;height:auto;display:block}
.ov{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px}
.ov .box{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
.ov.sheet{background:rgba(0,0,0,.45);align-items:flex-end;padding:0}
.ov.sheet .box{max-width:520px;max-height:92vh;overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}

nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:5;pointer-events:none;
  padding:6px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));
}
nav.tabs .in{pointer-events:auto;max-width:496px;margin-inline:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:6px;box-shadow:0 8px 26px rgba(22,32,28,.14)}
.tab{background:none;border:0;border-radius:18px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:12px;font-weight:600;padding:0}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--on-accent);background:var(--accent)}
.rhero{border-radius:32px;padding:18px 16px 16px;color:#fff;background:linear-gradient(160deg,#0F766E,#134E4A);display:flex;flex-direction:column;align-items:center;gap:12px}
.ringbox{position:relative;width:min(210px,64vw);aspect-ratio:1}
.ringbox svg{width:100%;height:100%;display:block}
.ringc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ringc .k{font-size:13px;color:#BDE8E1}
.ringc .v{font-size:36px;line-height:1.15;font-weight:700;letter-spacing:-.02em}
.rleg{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;font-size:12px;color:#D5F3EE}
.rpills{display:flex;gap:8px;width:100%}
.rpills div{flex:1;min-width:0;background:rgba(255,255,255,.14);border-radius:18px;padding:8px 10px;text-align:center}
.rpills span{display:block;font-size:12px;color:#BDE8E1}
.rpills b{font-size:18px}
.rpills .neg{color:#FFB4A9}
#toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));
  max-width:min(92vw,480px);background:var(--fg);color:var(--bg);border-radius:12px;padding:10px 16px;
  display:flex;align-items:center;gap:14px;font-size:14px;font-weight:500;z-index:20
}
#toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;padding:4px}
@media (prefers-reduced-motion:no-preference){ .fill{transition:width .35s ease} }
@media (min-width:480px){ .two{grid-template-columns:1fr 1fr} }
</style>
<style>[hidden]{display:none!important}:root{padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}html{background:var(--bg)}body{margin:0}</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<div class="ov sheet" id="sheet" hidden>
  <div class="box" role="dialog" aria-modal="true" aria-labelledby="sheetT">
    <h2 id="sheetT">কপি করুন</h2>
    <p class="hint">লেখাটা চেপে ধরে সব নির্বাচন করে কপি করুন।</p>
    <textarea class="ta" id="sheetTx" readonly></textarea>
    <button class="primary" id="sheetX" type="button">বন্ধ করুন</button>
  </div>
</div>
<div class="ov sheet" id="editSheet" hidden>
  <form class="box" id="editForm" autocomplete="off" role="dialog" aria-modal="true" aria-label="খরচ সম্পাদনা"></form>
</div>
<div class="ov" id="lock" hidden>
  <form class="box" id="lockForm" autocomplete="off">
    <h1>হাতখরচ</h1>
    <label for="lockPin">পিন লিখুন</label>
    <input class="txt" id="lockPin" type="password" inputmode="numeric" maxlength="6" autocomplete="off">
    <div class="hint" id="lockErr" role="alert"></div>
    <button class="primary" type="submit">খুলুন</button>
    <button class="ghost" type="button" id="lockBio" data-act="bio-unlock" hidden>আঙুলের ছাপ দিয়ে খুলুন</button>
  </form>
</div>
<nav class="tabs" aria-label="প্রধান মেনু"><div class="in">
  <button class="tab" data-view="home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4z"/></svg>হোম</button>
  <button class="tab" data-view="exp"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg>খরচ</button>
  <button class="tab" data-view="inc"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>আয়</button>
  <button class="tab" data-view="report"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>রিপোর্ট</button>
  <button class="tab" data-view="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>আরও</button>
</div></nav>

<script>
(function(){
'use strict';
var CATS=[
  {id:'tea',n:'চা-নাস্তা',v:'--c1'},{id:'food',n:'খাবার',v:'--c2'},{id:'ride',n:'যাতায়াত',v:'--c3'},
  {id:'bazar',n:'বাজার',v:'--c4'},{id:'mobile',n:'মোবাইল',v:'--c5'},{id:'fun',n:'বিনোদন',v:'--c6'},
  {id:'health',n:'স্বাস্থ্য',v:'--c7'},{id:'home',n:'বাসা ও পরিবার',v:'--c9'},{id:'edu',n:'পড়াশোনা',v:'--c10'},
  {id:'loan',n:'কিস্তি',v:'--c11'},{id:'other',n:'অন্যান্য',v:'--c8'}
];
var WAL=[{id:'bank',n:'বেতন অ্যাকাউন্ট'},{id:'cash',n:'হাতে নগদ'},{id:'bkash',n:'বিকাশ/নগদ অ্যাপ'},{id:'savings',n:'সঞ্চয় অ্যাকাউন্ট'}];
var SRC=[{id:'salary',n:'বেতন'},{id:'ot',n:'ওভারটাইম'},{id:'bonus',n:'বোনাস'},{id:'adv',n:'অগ্রিম বেতন'},{id:'other',n:'অন্যান্য আয়'}];
function allCats(){return CATS.concat(S.cats||[]);}
function catById(id){var a=allCats(),i;for(i=0;i<a.length;i++){if(a[i].id===id)return a[i];}return CATS[CATS.length-1];}
function walName(id){for(var i=0;i<WAL.length;i++){if(WAL[i].id===id)return WAL[i].n;}return WAL[0].n;}
function srcName(id){for(var i=0;i<SRC.length;i++){if(SRC[i].id===id)return SRC[i].n;}return SRC[SRC.length-1].n;}

var K2='hatkhoroch-v2',K1='hatkhoroch-v1',storageOk=true;
function defState(){return {income:[],expenses:[],fixed:[],fixedLog:{},goals:[],savings:[],debts:[],transfers:[],cats:[],quick:[],wallets:{cash:0,bank:0,bkash:0,savings:0},limits:{daily:0,monthly:0,cats:{},skip:['loan']},settings:{pin:'',carry:true,salaryDay:0,cycleDay:1,lastBackup:0,leftDone:'',lastAlert:'',rem:{on:false,time:'21:00',alerts:true},bio:false}};}
var S=defState();
function adopt(o){
  if(!o||typeof o!=='object')return false;
  ['income','expenses','fixed','goals','savings','debts','transfers','cats','quick'].forEach(function(k){if(Array.isArray(o[k]))S[k]=o[k];});
  S.cats=S.cats.filter(function(c){return c&&c.id&&c.n&&c.v;});
  S.quick=S.quick.filter(function(q){return q&&q.id&&q.amount>0;});
  S.transfers=S.transfers.filter(function(t){return t&&t.from&&t.to&&t.amount>0&&t.date;});
  if(o.fixedLog&&typeof o.fixedLog==='object')S.fixedLog=o.fixedLog;
  if(o.wallets){['cash','bank','bkash','savings'].forEach(function(w){S.wallets[w]=+o.wallets[w]||0;});}
  if(o.limits){S.limits.daily=+o.limits.daily||0;S.limits.monthly=+o.limits.monthly||0;S.limits.cats=(o.limits.cats&&typeof o.limits.cats==='object')?o.limits.cats:{};S.limits.skip=Array.isArray(o.limits.skip)?o.limits.skip.map(String):['loan'];}
  if(o.settings){S.settings.pin=String(o.settings.pin||'');S.settings.carry=o.settings.carry!==false;S.settings.salaryDay=+o.settings.salaryDay||0;
    var cd0=+o.settings.cycleDay||1;S.settings.cycleDay=(cd0>=1&&cd0<=28)?cd0:1;S.settings.lastBackup=+o.settings.lastBackup||0;S.settings.leftDone=String(o.settings.leftDone||'');
    var r0=o.settings.rem||{};S.settings.rem={on:!!r0.on,time:/^\d\d:\d\d$/.test(r0.time||'')?r0.time:'21:00',alerts:r0.alerts!==false};S.settings.lastAlert=String(o.settings.lastAlert||'');S.settings.bio=!!o.settings.bio;}
  return true;
}
try{
  localStorage.setItem('__t','1');localStorage.removeItem('__t');
  var raw=localStorage.getItem(K2);
  if(raw){adopt(JSON.parse(raw));}
  else{var raw1=localStorage.getItem(K1);if(raw1)adopt(JSON.parse(raw1));}
}catch(e){storageOk=false;}
function save(){
  try{
    var d0=todayKey();
    if(localStorage.getItem('hk-snapday')!==d0){
      var old=localStorage.getItem(K2);
      if(old){localStorage.setItem('hk-prevday',old);localStorage.setItem('hk-prevdate',localStorage.getItem('hk-snapday')||'');}
      localStorage.setItem('hk-snapday',d0);
    }
    localStorage.setItem(K2,JSON.stringify(S));
  }catch(e){storageOk=false;}
  queueSync();
}

var selBig=false, openDay=null, view='home', selCat='tea', selSrc='salary', selDebt='owe', lastWal='bank', confirmClear=false, toastTimer=null, autoMade=0;
var mRef=pRef(curPre()), editId=null, editBig=false;

var BN='০১২৩৪৫৬৭৮৯';
function toEn(s){return String(s).replace(/[০-৯]/g,function(d){return BN.indexOf(d);}).replace(/[,،৳\s]/g,'').replace('।','.');}
function parseAmt(s){var n=parseFloat(toEn(s));return isFinite(n)?n:NaN;}
var nf=new Intl.NumberFormat('bn-BD',{maximumFractionDigits:2});
var nfPlain=new Intl.NumberFormat('bn-BD',{maximumFractionDigits:2,useGrouping:false});
function taka(n){return '৳ '+nf.format(n);}
function pct(p){return nf.format(Math.round(p*100))+'%';}
function pad(n){return String(n).padStart(2,'0');}
function keyOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function todayKey(){return keyOf(new Date());}
function dateOf(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function monthKey(y,m){var d=new Date(y,m,1);return d.getFullYear()+'-'+pad(d.getMonth()+1);}
function cycleDay(){var d=+S.settings.cycleDay||1;return (d>=1&&d<=28)?d:1;}
function periodOf(k){var d=dateOf(k),y=d.getFullYear(),m=d.getMonth();if(d.getDate()<cycleDay())m--;return monthKey(y,m);}
function curPre(){return periodOf(todayKey());}
function pRef(pre){return {y:+pre.slice(0,4),m:+pre.slice(5,7)-1};}
function pStart(pre){return pre+'-'+pad(cycleDay());}
function pEnd(pre){var r=pRef(pre);return keyOf(new Date(r.y,r.m+1,cycleDay()-1));}
function periodDays(pre){return Math.round((dateOf(pEnd(pre))-dateOf(pStart(pre)))/86400000)+1;}
function addDays(k,n){var d=dateOf(k);return keyOf(new Date(d.getFullYear(),d.getMonth(),d.getDate()+n));}
function validDate(s){return /^\d{4}-\d{2}-\d{2}$/.test(s);}
function dateToT(dk){if(dk===todayKey())return Date.now();var d=dateOf(dk);return new Date(d.getFullYear(),d.getMonth(),d.getDate(),12).getTime();}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmtDate(d,o){return new Intl.DateTimeFormat('bn-BD',o).format(d);}
function tot(list){var t=0;for(var i=0;i<list.length;i++)t+=list[i].amount;return t;}
function inRange(list,pre){var a=pStart(pre),b=pEnd(pre);return list.filter(function(e){return e.date>=a&&e.date<=b;});}
function inMonth(list,pre){return list.filter(function(e){return e.date.indexOf(pre)===0;});}
function ofDay(k){return S.expenses.filter(function(e){return e.date===k;});}
function monthLabel(pre){var p=pre.split('-');return fmtDate(new Date(+p[0],+p[1]-1,1),{month:'long',year:'numeric'});}
function periodLabel(pre){
  if(cycleDay()===1)return monthLabel(pre);
  var o={day:'numeric',month:'short'};
  return fmtDate(dateOf(pStart(pre)),o)+' – '+fmtDate(dateOf(pEnd(pre)),o);
}
function val(id){var el=document.getElementById(id);return el?el.value:'';}

function savingMove(list){
  return tot(list.filter(function(x){return x.to==='savings'&&x.from!=='savings';}))-
         tot(list.filter(function(x){return x.from==='savings'&&x.to!=='savings';}));
}
function balBefore(pre){
  var lim=pStart(pre);
  function b(l){return tot(l.filter(function(e){return e.date<lim;}));}
  var tr=S.transfers.filter(function(x){return x.date<lim;});
  return b(S.income)-b(S.expenses)-b(S.savings.filter(function(x){return (x.wallet||'cash')!=='savings';}))+savingMove(tr);
}
function monthFigures(pre){
  var i=tot(inRange(S.income,pre)),e=tot(inRange(S.expenses,pre));
  var s=tot(inRange(S.savings,pre).filter(function(x){return (x.wallet||'cash')!=='savings';}))+savingMove(inRange(S.transfers,pre)),c=S.settings.carry?balBefore(pre):0;
  return {inc:i,exp:e,sav:s,carry:c,left:c+i-e-s};
}
function walBal(w){
  var b=S.wallets[w]||0;
  S.income.forEach(function(x){if((x.wallet||'cash')===w)b+=x.amount;});
  S.expenses.forEach(function(x){if((x.wallet||'cash')===w)b-=x.amount;});
  S.savings.forEach(function(x){
    var source=x.wallet||'cash';
    if(source===w&&source!=='savings')b-=x.amount;
    if(w==='savings'&&source!=='savings')b+=x.amount;
  });
  S.transfers.forEach(function(x){if(x.from===w)b-=x.amount;if(x.to===w)b+=x.amount;});
  return b;
}
function goalSaved(id){return tot(S.savings.filter(function(s){return s.goalId===id;}));}

var WDN=['রবি','সোম','মঙ্গল','বুধ','বৃহস্পতি','শুক্র','শনি'];
function isWeekly(f){return f.wd!==undefined&&f.wd!==null&&f.wd!=='';}
function logCount(f){var p=f.id+'|',c=0;Object.keys(S.fixedLog).forEach(function(k){if(k.indexOf(p)===0)c++;});return c;}
function fxDone(f){return (+f.done0||0)+logCount(f);}
function fxComplete(f){return +f.total>0&&fxDone(f)>=+f.total;}
function fxLive(f){return f.active&&!fxComplete(f);}
function fxM(f){return {amount:isWeekly(f)?Math.round(f.amount*52/12):f.amount};}
function runFixed(){
  var tk=todayKey(),n=new Date(),ty=n.getFullYear(),tm=n.getMonth(),made=0;
  S.fixed.forEach(function(f){
    if(!f.active)return;
    function mk(dk,lk){
      S.fixedLog[lk]=1;
      var ex={id:uid(),date:dk,amount:f.amount,cat:f.cat,note:f.name,t:dateToT(dk),wallet:f.wallet||'bank',fixedId:f.id,auto:true};
      if(f.sample)ex.sample=true;
      S.expenses.push(ex);made++;
    }
    var guard=0;
    if(isWeekly(f)){
      var sd=dateOf(f.startD||tk);
      while(sd.getDay()!==+f.wd&&guard<8){sd.setDate(sd.getDate()+1);guard++;}
      var dk=keyOf(sd);guard=0;
      while(dk<=tk&&guard<800){
        guard++;
        var lk=f.id+'|'+dk;
        if(!S.fixedLog[lk]){if(fxComplete(f))break;mk(dk,lk);}
        dk=addDays(dk,7);
      }
      return;
    }
    var p=f.start.split('-'),y=+p[0],m=+p[1]-1;
    while((y<ty||(y===ty&&m<=tm))&&guard<600){
      guard++;
      var dim=new Date(y,m+1,0).getDate();
      var dk2=y+'-'+pad(m+1)+'-'+pad(Math.min(f.day,dim));
      var lk2=f.id+'|'+y+'-'+pad(m+1);
      if(dk2<=tk&&!S.fixedLog[lk2]){
        if(fxComplete(f))break;
        mk(dk2,lk2);
      }
      m++;if(m>11){m=0;y++;}
    }
  });
  if(made){save();autoMade+=made;}
}

function upcoming(days){
  var out=[],n=new Date(),t0=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  function nextOf(day){
    for(var k=0;k<2;k++){
      var y=t0.getFullYear(),m=t0.getMonth()+k,dim=new Date(y,m+1,0).getDate(),d=new Date(y,m,Math.min(day,dim));
      var diff=Math.round((d-t0)/86400000);
      if(diff>=0)return {diff:diff,d:d};
    }
    return null;
  }
  S.fixed.forEach(function(f){
    if(!fxLive(f))return;
    if(isWeekly(f)){
      var d0=((+f.wd)-t0.getDay()+7)%7;
      if(d0<=days)out.push({kind:'bill',name:f.name,amount:f.amount,diff:d0});
      return;
    }
    var x=nextOf(f.day);
    if(x&&x.diff<=days&&monthKey(x.d.getFullYear(),x.d.getMonth())>=f.start)out.push({kind:'bill',name:f.name,amount:f.amount,diff:x.diff});
  });
  if(S.settings.salaryDay){
    var s=nextOf(S.settings.salaryDay);
    if(s&&s.diff<=days)out.push({kind:'salary',name:'বেতন পাওয়ার দিন',amount:0,diff:s.diff});
  }
  return out.sort(function(a,b){return a.diff-b.diff;});
}
function inDays(d){return d===0?'আজ':d===1?'আগামীকাল':nf.format(d)+' দিন পরে';}

function skipCat(id){return (S.limits.skip||[]).indexOf(id)>-1;}
function limitList(list){return list.filter(function(e){return !e.auto&&!e.adj&&!skipCat(e.cat);});}

function dayAllowance(k){
  var m=+S.limits.monthly||0;
  if(!m)return S.limits.daily?{allow:+S.limits.daily,mode:'fixed'}:null;
  var pre=periodOf(k),ps=pStart(pre),left=Math.round((dateOf(pEnd(pre))-dateOf(k))/86400000)+1;
  var before=tot(limitList(S.expenses).filter(function(e){return e.date>=ps&&e.date<k;}));
  var rem=m-before;
  return {allow:Math.max(0,rem/left),mode:'auto',rem:rem,left:left};
}
function daySpend(k){return tot(limitList(ofDay(k)).filter(function(e){return !e.big;}));}
function allowCap(a){return a?(a.mode==='fixed'?a.allow:Math.floor(a.allow)):0;}
function dayOver(k){var a=dayAllowance(k);return !!a&&daySpend(k)>allowCap(a);}
function dailyMeter(k){
  var a=dayAllowance(k),spent=daySpend(k);
  if(!a)return meter('আজকের লিমিট',0,0);
  if(a.mode==='fixed')return meter('আজকের লিমিট',spent,a.allow);
  var cap=allowCap(a);
  if(cap<=0){
    return '<div class="meter over"><div class="mhead"><span class="t">আজকের সীমা</span><span class="num">'+taka(spent)+'</span></div><div class="st">'+(a.rem<0?'মাসের লিমিট ছাড়িয়েছে '+taka(-a.rem):'মাসের লিমিট শেষ হয়ে গেছে')+'</div></div>';
  }
  return meter('আজকের সীমা (চলমান)',spent,cap)+'<div class="st">মাসের বাকি '+taka(a.rem)+' ÷ '+nf.format(a.left)+' দিন। কম খরচ করলে কালকের সীমা বাড়বে, বেশি করলে কমবে। বড় খরচ এতে ধরা হয় না।</div>';
}
function meter(title,spent,limit){
  if(!limit){
    return '<div class="meter"><div class="mhead"><span class="t">'+title+'</span><button class="link" data-view="limits">লিমিট ঠিক করুন</button></div></div>';
  }
  var p=spent/limit,cls=p>1?'over':(p>=0.8?'near':'ok');
  var msg=p>1?('লিমিট ছাড়িয়েছে '+taka(spent-limit)):((p>=0.8?'সীমার কাছে, ':'')+'বাকি '+taka(limit-spent));
  return '<div class="meter '+cls+'"><div class="mhead"><span class="t">'+title+'</span><span class="num">'+taka(spent)+' / '+taka(limit)+'</span></div>'+
    '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+Math.min(100,Math.round(p*100))+'"><div class="fill" style="width:'+Math.min(100,p*100)+'%"></div></div>'+
    '<div class="st">'+pct(p)+' ব্যবহার হয়েছে · '+msg+'</div></div>';
}

  var ids=Object.keys(by).sort(function(a,b){return by[b]-by[a];});
  if(!ids.length)return '';
  return ids.map(function(id){
    var c=catById(id),v=by[id],lim=+S.limits.cats[id]||0,over=lim&&v>lim;
    return '<div class="cat" style="color:var('+c.v+')"><div class="top"><span class="dot" style="background:currentColor"></span><span class="nm" style="color:var(--fg)">'+c.n+
      (lim?' <span class="hint">সীমা '+taka(lim)+'</span>':'')+'</span>'+(over?'<span class="pill">সীমা ছাড়িয়েছে</span>':'')+'<b class="num" style="color:var(--fg)">'+taka(v)+'</b></div>'+

  }).join('');
}

var CAPA=window.Capacitor,syncT=null;
function isNative(){try{return !!(CAPA&&CAPA.isNativePlatform&&CAPA.isNativePlatform());}catch(e){return false;}}
function plug(n){try{return (CAPA.Plugins&&CAPA.Plugins[n])||CAPA.registerPlugin(n);}catch(e){return null;}}
function shareFile(name,text,title,done){
  var FS=plug('Filesystem'),SH=plug('Share');
  if(!FS||!SH){done(false);return;}
  FS.writeFile({path:name,data:text,directory:'CACHE',encoding:'utf8'}).then(function(r){
    return SH.share({title:title,dialogTitle:title,url:r.uri});
  }).then(function(){done(true);},function(err){
    var m=String((err&&err.message)||err||'');
    done(/cancel/i.test(m)?null:false);
  });
}
function shareText(text,title,done){
  var SH=plug('Share');
  if(!SH){done(false);return;}
  SH.share({title:title,text:text,dialogTitle:title}).then(function(){done(true);},function(err){
    var m=String((err&&err.message)||err||'');
    done(/cancel/i.test(m)?null:false);
  });
}
function lnReady(cb){
  var LN=plug('LocalNotifications');if(!LN)return;
  LN.checkPermissions().then(function(p){cb(LN,p.display==='granted');},function(){});
}
function occurs(day,n){
  var out=[],t0=dateOf(todayKey()),k=0;
  while(out.length<n&&k<6){
    var y=t0.getFullYear(),m=t0.getMonth()+k,dim=new Date(y,m+1,0).getDate(),d=new Date(y,m,Math.min(day,dim));
    if(d>=t0)out.push(d);
    k++;
  }
  return out;
}
function syncReminders(){
  var LN=plug('LocalNotifications');if(!LN)return;
  var rem=S.settings.rem;
  LN.getPending().then(function(r){
    var ids=(r.notifications||[]).map(function(x){return {id:x.id};});
    return ids.length?LN.cancel({notifications:ids}):null;
  }).then(function(){
    if(!rem.on)return null;
    var list=[],hm=rem.time.split(':'),nowT=Date.now(),idn=100;
    list.push({id:1,title:'হাতখরচ',body:'আজকের খরচ লিখেছেন তো?',schedule:{on:{hour:+hm[0],minute:+hm[1]},allowWhileIdle:true}});
    list.push({id:2,title:'ব্যাকআপ নেওয়ার দিন',body:'সপ্তাহে একবার ব্যাকআপ ফাইল নিজের কাছে রাখুন। হাতখরচ খুলে আরও > ব্যাকআপ চাপুন।',schedule:{on:{weekday:6,hour:10,minute:0},allowWhileIdle:true}});
    function add(at,title,body){if(at.getTime()>nowT+60000&&list.length<60)list.push({id:idn++,title:title,body:body,schedule:{at:at,allowWhileIdle:true}});}
    S.fixed.forEach(function(f,fi){
      if(!fxLive(f))return;
      if(isWeekly(f)){
        if(list.length<60)list.push({id:300+fi,title:'আজ '+f.name,body:taka(f.amount)+' সাপ্তাহিক খরচ আজ হিসাবে যোগ হবে',schedule:{on:{weekday:(+f.wd)+1,hour:9,minute:0},allowWhileIdle:true}});
        return;
      }
      occurs(f.day,2).forEach(function(d){
        add(new Date(d.getFullYear(),d.getMonth(),d.getDate()-1,9,0),'আগামীকাল '+f.name,taka(f.amount)+' নির্ধারিত খরচের দিন কাল');
        add(new Date(d.getFullYear(),d.getMonth(),d.getDate(),9,0),'আজ '+f.name,taka(f.amount)+' আজ হিসাবে যোগ হবে');
      });
    });
    if(S.settings.salaryDay)occurs(S.settings.salaryDay,2).forEach(function(d){add(new Date(d.getFullYear(),d.getMonth(),d.getDate(),9,0),'বেতনের দিন','আজ বেতন পাওয়ার কথা। আয়ে যোগ করুন।');});
    return LN.schedule({notifications:list});
  }).catch(function(){});
}
function queueSync(){
  if(!isNative()||!S.settings.rem||!S.settings.rem.on)return;
  clearTimeout(syncT);syncT=setTimeout(syncReminders,1500);
}
function maybeAlert(m){
  if(!isNative()||!S.settings.rem.alerts||!/ছাড়িয়ে|কাছে/.test(m))return;
  var key=todayKey()+'|'+m;
  if(S.settings.lastAlert===key)return;
  S.settings.lastAlert=key;save();
  lnReady(function(LN,ok){
    if(ok)LN.schedule({notifications:[{id:1000+Math.floor(Math.random()*1000000000),title:'হাতখরচ সতর্কতা',body:m,schedule:{at:new Date(Date.now()+700)}}]}).catch(function(){});
  });
}
function limitToast(dk,cat,big){var m=limitMsg(dk,cat,big);maybeAlert(m);return m;}

function reassignCat(id){
  S.expenses.forEach(function(e){if(e.cat===id)e.cat='other';});
  S.fixed.forEach(function(e){if(e.cat===id)e.cat='other';});
  S.quick.forEach(function(e){if(e.cat===id)e.cat='other';});
  delete S.limits.cats[id];
  if(selCat===id)selCat='tea';
}
function homeNotes(){
  var h='',tk=todayKey(),cp=curPre();
  var pp=monthKey(+cp.slice(0,4),+cp.slice(5,7)-2);
  if(S.goals.length&&S.settings.leftDone!==pp&&tk<=addDays(pStart(cp),6)){
    var pf=monthFigures(pp);
    if((pf.inc>0||pf.exp>0)&&pf.left>=100)h+='<div class="note"><span>গত মাসে '+taka(Math.floor(pf.left))+' অবশিষ্ট ছিল। সঞ্চয়ে নেবেন?</span><button class="link" data-act="left-go" data-id="'+pp+'">দেখুন</button></div>';
  }
  var lb=+S.settings.lastBackup||0;
  if(S.expenses.length>=5&&(!lb||Date.now()-lb>7*86400000))h+='<div class="note"><span>'+(lb?'৭ দিনের বেশি ব্যাকআপ নেওয়া হয়নি।':'এখনো ব্যাকআপ নেওয়া হয়নি।')+' ফোন হারালে হিসাব চলে যাবে।</span>'+(isNative()?'<button class="link" data-act="backup-share">এখনই পাঠান</button>':'<button class="link" data-view="security">ব্যাকআপ নিন</button>')+'</div>';
  return h;
}

function submitEditOther(){
  var arr=editKind==='inc'?S.income:(editKind==='fix'?S.fixed:S.debts),o=null,a=parseAmt(val('eamt')),dk;
  arr.forEach(function(x){if(String(x.id)===editId)o=x;});
  if(!o){document.getElementById('editSheet').hidden=true;return;}
  if(!(a>0)){fail('editErr','সঠিক টাকার অঙ্ক লিখুন।','eamt');return;}
  var snapE=snapshot();
  if(editKind==='inc'){
    dk=val('edt');if(!validDate(dk))dk=o.date;
    if(dk!==o.date){o.date=dk;o.t=dateToT(dk);}
    o.amount=a;o.source=val('esrc')||o.source;o.note=val('enote').trim();o.wallet=val('ewl')||o.wallet;
  }else if(editKind==='fix'){
    var nm=val('efn').trim();if(!nm){fail('editErr','নাম লিখুন।','efn');return;}
    var tt=parseInt(toEn(val('eftot')),10)||0,dn=parseInt(toEn(val('efdone')),10)||0;
    if(tt<0||dn<0||(tt>0&&dn>=tt)){fail('editErr','আগে দেওয়া কিস্তি মোট কিস্তির চেয়ে কম হতে হবে।','efdone');return;}
    if(isWeekly(o)){o.wd=+val('efwd');}
    else{var dy=parseInt(toEn(val('efday')),10);if(!(dy>=1&&dy<=31)){fail('editErr','তারিখ ১ থেকে ৩১-এর মধ্যে হতে হবে।','efday');return;}o.day=dy;}
    o.name=nm;o.amount=a;o.cat=val('ecat')||o.cat;o.wallet=val('ewl')||o.wallet;
    if(tt>0){o.total=tt;o.done0=dn;}else{delete o.total;delete o.done0;}
  }else{
    var pn=val('edp').trim();if(!pn){fail('editErr','নাম লিখুন।','edp');return;}
    var pd=parseAmt(val('edpaid'));if(!isFinite(pd)||pd<0)pd=0;
    if(pd>a){fail('editErr','শোধ করা টাকা মোট টাকার বেশি হতে পারে না।','edpaid');return;}
    o.person=pn;o.amount=a;o.paid=pd;o.note=val('enote').trim();
  }
  document.getElementById('editSheet').hidden=true;editId=null;editKind='exp';
  save();render(false);showToast('ঠিক করা হয়েছে','ফিরিয়ে আনুন',function(){restoreSnap(snapE);});
}

function financialAdvisor(){
  var pre=curPre(),f=monthFigures(pre),inc=f.inc,spent=f.exp,saved=f.sav;
  var start=dateOf(pStart(pre)),end=dateOf(pEnd(pre)),now=dateOf(todayKey());
  var totalDays=periodDays(pre),elapsed=Math.max(1,Math.min(totalDays,Math.floor((now-start)/86400000)+1));
  var leftDays=Math.max(1,totalDays-elapsed+1),avg=spent/elapsed,forecast=Math.round(avg*totalDays);
  var budget=+S.limits.monthly||Math.max(0,f.carry+inc),remain=budget-spent;
  var daily=Math.max(0,Math.floor(remain/leftDays));
  var savingRate=inc>0?saved/inc:0,advice='',status='';
  if(inc<=0){status='আয় যোগ করা হয়নি';advice='প্রথমে এই মাসের বেতন বা আয় যোগ করুন। এরপর বাজেট ও সঞ্চয়ের পরামর্শ আরও নির্ভুল হবে.';}
  else if(remain<0){status='বাজেট অতিক্রম';advice='এই মাসে বাজেট '+taka(-remain)+' ছাড়িয়েছেন। অপ্রয়োজনীয় খরচ বন্ধ করে নির্ধারিত বিল ও জরুরি খরচকে অগ্রাধিকার দিন.';}
  else if(forecast>budget){status='খরচের গতি বেশি';advice='বর্তমান খরচের গতি থাকলে মাস শেষে প্রায় '+taka(forecast-budget)+' বাজেট ছাড়াতে পারেন। আগামী কয়েক দিন দৈনিক খরচ কমান.';}
  else if(savingRate<0.1){status='সঞ্চয় বাড়ানোর সুযোগ';advice='এখন পর্যন্ত আয়ের ১০%-এর কম সঞ্চয় হয়েছে। সম্ভব হলে ছোট একটি নির্দিষ্ট অঙ্ক সঞ্চয়ে সরিয়ে রাখুন.';}
  else{status='বাজেটের মধ্যে';advice='আপনি আপাতত বাজেটের মধ্যে আছেন। দৈনিক খরচ প্রায় '+taka(daily)+'-এর মধ্যে রাখলে পরিকল্পনা ধরে রাখা সহজ হবে.';}
  var h='<section class="card"><div class="mhead"><h2>আমার আর্থিক পরামর্শ</h2><span class="pill '+(remain>=0?'ok':'')+'">'+status+'</span></div>';
  h+='<p class="hint">আপনার এই মাসের আয়, খরচ, সঞ্চয় ও বাজেটের হিসাব থেকে পরামর্শ তৈরি হয়েছে।</p>';
  h+='<div class="stats"><div class="stat"><span class="k">এখন পর্যন্ত খরচ</span><b class="num">'+taka(spent)+'</b></div><div class="stat"><span class="k">বাজেট বাকি</span><b class="num '+(remain<0?'neg':'pos')+'">'+taka(remain)+'</b></div><div class="stat"><span class="k">দৈনিক প্রস্তাবিত</span><b class="num">'+taka(daily)+'</b></div></div>';
  h+='<div class="note"><span>'+esc(advice)+'</span></div>';
  if(inc>0)h+='<div class="meter"><div class="mhead"><span class="t">মাস শেষে সম্ভাব্য খরচ</span><b class="num">'+taka(forecast)+'</b></div>'+meter('বাজেটের ব্যবহার (পূর্বাভাস)',forecast,budget)+'</div>';
  h+='<div class="inl"><button class="ghost small" data-view="inc" style="flex:1">বেতন বরাদ্দ</button><button class="ghost small" data-view="limits" style="flex:1">বাজেট ঠিক করুন</button></div></section>';
  return h;
}

var sugList=[];
function freqNotes(q){
  q=(q||'').trim().toLowerCase();
  var by={};
  S.expenses.forEach(function(e){
    if(e.auto||e.adj||e.sample)return;
    var n=(e.note||'').trim();if(!n)return;
    var k=n.toLowerCase();
    if(q&&k.indexOf(q)<0)return;
    var o=by[k]||(by[k]={note:n,n:0,amts:{},cat:e.cat,t:0});
    o.n++;o.amts[e.amount]=(o.amts[e.amount]||0)+1;
    if((e.t||0)>=o.t){o.t=e.t||0;o.cat=e.cat;o.note=n;}
  });
  var out=Object.keys(by).map(function(k){
    var o=by[k],best=0,ba=0;
    Object.keys(o.amts).forEach(function(a){var c=o.amts[a];if(c>best||(c===best&&+a>ba)){best=c;ba=+a;}});
    o.amt=ba;return o;
  });
  out.sort(function(a,b){return b.n-a.n||b.t-a.t;});
  return out.slice(0,6);
}

  }).join('');
}

function compareCard(pre,exps){

function fxInfo(f){
  var t='';
  if(isWeekly(f))t='প্রতি '+WDN[+f.wd]+'বার';else t='প্রতি মাসের '+nf.format(f.day)+' তারিখ';
  return t;
}
function fxProgress(f){
  if(!(+f.total>0))return '';
  var d=fxDone(f),tt=+f.total,rem=Math.max(0,tt-d);
  if(rem===0)return '<div class="st pos">সব '+nf.format(tt)+'টি শেষ</div>'+'<div class="bar"><div class="fill" style="width:100%"></div></div>';
  var end='';
  if(isWeekly(f))end=' · বাকি '+nf.format(rem)+' সপ্তাহ';
  else{
    var n=new Date(),thisDone=S.fixedLog[f.id+'|'+monthKey(n.getFullYear(),n.getMonth())]?1:0;
    var ed=new Date(n.getFullYear(),n.getMonth()+thisDone+rem-1,1);
    end=' · শেষ হবে '+fmtDate(ed,{month:'long',year:'numeric'});
  }
  return '<div class="st">কিস্তি '+nf.format(d)+'/'+nf.format(tt)+' দেওয়া হয়েছে, বাকি '+nf.format(rem)+'টি'+end+'</div><div class="bar"><div class="fill" style="width:'+Math.min(100,d/tt*100)+'%"></div></div>';
}

function vCal(){
  var y=mRef.y,m=mRef.m,pre=monthKey(y,m),dim=new Date(y,m+1,0).getDate(),off=(new Date(y,m,1).getDay()+1)%7,ev={};
  function add(d,k,t){(ev[d]=ev[d]||[]).push({k:k,t:t});}
  S.fixed.forEach(function(f){
    if(!fxLive(f))return;
    if(isWeekly(f)){
      for(var dd=1;dd<=dim;dd++){var kk=pre+'-'+pad(dd);if(new Date(y,m,dd).getDay()===+f.wd&&kk>=(f.startD||'0000-00-00'))add(dd,'bill',f.name+' · '+taka(f.amount));}
    }else if(pre>=f.start)add(Math.min(f.day,dim),'bill',f.name+' · '+taka(f.amount));
  });
  var got=inMonth(S.income.filter(function(i){return i.source==='salary';}),pre);
  got.forEach(function(i){add(+i.date.slice(8,10),'got','বেতন পাওয়া গেছে · '+taka(i.amount));});
  if(S.settings.salaryDay&&!got.length)add(Math.min(S.settings.salaryDay,dim),'sal','বেতন পাওয়ার কথা');
  var c=new Date(),isCur=(y===c.getFullYear()&&m===c.getMonth());

  var i;

    }).join('')+'</ul></section>';

  h+='<form class="card" id="calForm" autocomplete="off"><label for="sday">বেতন সাধারণত মাসের কত তারিখে পান?</label>'+
     '<input class="txt" id="sday" inputmode="numeric" placeholder="যেমন ৭" value="'+(S.settings.salaryDay?nfPlain.format(S.settings.salaryDay):'')+'">'+

var VIEWS={home:vHome,exp:vExp,inc:vInc,report:vReport,more:vMore,fixed:vFixed,calendar:vCal,goals:vGoals,debts:vDebts,wallets:vWallets,limits:vLimits,security:vSec,cust:vCust,remind:vRemind,all:vAll};
var app=document.getElementById('app');
function render(scroll){
  runFixed();
  if(!VIEWS[view])view='home';
  app.innerHTML=VIEWS[view]();
  var tabs=document.querySelectorAll('.tab');
  for(var i=0;i<tabs.length;i++){if(tabs[i].getAttribute('data-view')===TABOF[view])tabs[i].setAttribute('aria-current','page');else tabs[i].removeAttribute('aria-current');}
  if(scroll)window.scrollTo(0,0);
  if(autoMade){showToast(nf.format(autoMade)+'টি নির্ধারিত খরচ নিজে থেকে হিসাবে যোগ হয়েছে');autoMade=0;}
}

var toast=document.getElementById('toast');
function showToast(text,label,fn){
  toast.innerHTML='';var s=document.createElement('span');s.textContent=text;toast.appendChild(s);
  if(label){var b=document.createElement('button');b.textContent=label;b.onclick=function(){fn();toast.hidden=true;};toast.appendChild(b);}
  toast.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(function(){toast.hidden=true;},label?6000:4200);
}
function openSheet(title,text){
  document.getElementById('sheetT').textContent=title;
  var tx=document.getElementById('sheetTx');tx.value=text;
  document.getElementById('sheet').hidden=false;
  setTimeout(function(){tx.focus();tx.select();},50);
}
document.getElementById('sheetX').addEventListener('click',function(){document.getElementById('sheet').hidden=true;});
function copyText(t,msg,title){
  function fb(){openSheet(title||'কপি করুন',t);}
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){showToast(msg);},fb);return;}
  }catch(e){}
  fb();
}
function fail(id,msg,focusId){
  var el=document.getElementById(id);if(el){el.textContent=msg;el.style.color='var(--danger)';}
  var f=focusId&&document.getElementById(focusId);if(f)f.focus();
}
function snapshot(){return JSON.stringify(S);}
function restoreSnap(snap){var pin=S.settings.pin;S=defState();adopt(JSON.parse(snap));S.settings.pin=pin;save();render(false);}

document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-view],[data-cat],[data-src],[data-dk],[data-act],[data-m],[data-day],[data-big],[data-ebig]');
  if(!el)return;
  if(el.hasAttribute('data-big')){selBig=!selBig;el.setAttribute('aria-pressed',selBig);return;}
  if(el.hasAttribute('data-ebig')){editBig=!editBig;el.setAttribute('aria-pressed',editBig);return;}
  if(el.hasAttribute('data-day')){var dd=el.getAttribute('data-day');openDay=(openDay===dd)?null:dd;render(false);return;}
  if(el.hasAttribute('data-view')){view=el.getAttribute('data-view');if(view==='all'){mRef=pRef(curPre());allQ='';allKind='all';}confirmClear=false;openDay=null;render(true);return;}
  if(el.hasAttribute('data-cat')){selCat=el.getAttribute('data-cat');document.querySelectorAll('[data-cat]').forEach(function(c){c.setAttribute('aria-pressed',c.getAttribute('data-cat')===selCat);});return;}
  if(el.hasAttribute('data-src')){selSrc=el.getAttribute('data-src');document.querySelectorAll('[data-src]').forEach(function(c){c.setAttribute('aria-pressed',c.getAttribute('data-src')===selSrc);});return;}
  if(el.hasAttribute('data-dk')){selDebt=el.getAttribute('data-dk');document.querySelectorAll('[data-dk]').forEach(function(c){c.setAttribute('aria-pressed',c.getAttribute('data-dk')===selDebt);});return;}
  if(el.hasAttribute('data-m')){var nd=new Date(mRef.y,mRef.m+(+el.getAttribute('data-m')),1);mRef={y:nd.getFullYear(),m:nd.getMonth()};openDay=null;render(false);return;}
  var act=el.getAttribute('data-act'),id=el.getAttribute('data-id');
  if(act==='del'){
    var k=el.getAttribute('data-k'),arr=S[k],idx=-1,i;
    for(i=0;i<arr.length;i++){if(String(arr[i].id)===id){idx=i;break;}}
    if(idx>-1){
      var snap=snapshot();
      arr.splice(idx,1);
      if(k==='goals')S.savings=S.savings.filter(function(s){return s.goalId!==id;});
      if(k==='cats')reassignCat(id);
      save();render(false);
      showToast('মুছে ফেলা হয়েছে','ফিরিয়ে আনুন',function(){restoreSnap(snap);});
    }
  }
  else if(act==='skip-cat'){
    var sk=S.limits.skip||[],ix=sk.indexOf(id);
    if(ix>-1)sk.splice(ix,1);else sk.push(id);
    S.limits.skip=sk;save();
    el.setAttribute('aria-pressed',String(!skipCat(id)));
    showToast(skipCat(id)?'এই খাত এখন থেকে লিমিটে ধরা হবে না':'এই খাত এখন থেকে লিমিটে ধরা হবে');
  }
  else if(act==='all-kind'){allKind=id;render(false);}
  else if(act==='sug'){
    var so=sugList[+id];
    if(so){
      var ne0=document.getElementById('note'),ae0=document.getElementById('amt');
      if(ne0)ne0.value=so.note;
      if(ae0)ae0.value=String(so.amt);
      selCat=so.cat;
      document.querySelectorAll('[data-cat]').forEach(function(c){c.setAttribute('aria-pressed',c.getAttribute('data-cat')===selCat);});
      var sb=document.querySelector('#expForm button.primary');if(sb)sb.focus();
    }
  }
  else if(act==='repeat'){
    var rsrc=null;S.expenses.forEach(function(x){if(String(x.id)===id)rsrc=x;});
    if(rsrc){
      var snapR=snapshot(),dkr=todayKey();
      var rn={id:uid(),date:dkr,amount:rsrc.amount,cat:rsrc.cat,note:rsrc.note||'',t:Date.now(),wallet:rsrc.wallet||lastWal};
      if(rsrc.big)rn.big=true;
      S.expenses.push(rn);save();render(false);
      showToast(limitToast(dkr,rsrc.cat,!!rsrc.big),'ফিরিয়ে আনুন',function(){restoreSnap(snapR);});
    }
  }
  else if(act==='edit'){openEdit(id);}
  else if(act==='edit-inc'){openEditOther('inc',id);}
  else if(act==='edit-fix'){openEditOther('fix',id);}
  else if(act==='edit-debt'){openEditOther('debt',id);}
  else if(act==='edit-cancel'){document.getElementById('editSheet').hidden=true;editId=null;editKind='exp';}
  else if(act==='edit-del'){
    var snapD=snapshot();
    if(editKind==='inc')S.income=S.income.filter(function(x){return String(x.id)!==editId;});
    else if(editKind==='fix')S.fixed=S.fixed.filter(function(x){return String(x.id)!==editId;});
    else if(editKind==='debt')S.debts=S.debts.filter(function(x){return String(x.id)!==editId;});
    else S.expenses=S.expenses.filter(function(x){return String(x.id)!==editId;});
    document.getElementById('editSheet').hidden=true;editId=null;editKind='exp';
    save();render(false);showToast('মুছে ফেলা হয়েছে','ফিরিয়ে আনুন',function(){restoreSnap(snapD);});
  }
  else if(act==='quick'){
    var qi=null;S.quick.forEach(function(x){if(x.id===id)qi=x;});
    if(qi){
      var snapQ=snapshot(),dkq=todayKey();
      S.expenses.push({id:uid(),date:dkq,amount:qi.amount,cat:qi.cat,note:qi.note||'',t:Date.now(),wallet:lastWal});
      save();render(false);
      showToast(limitToast(dkq,qi.cat,false),'ফিরিয়ে আনুন',function(){restoreSnap(snapQ);});
    }
  }
  else if(act==='quick-save'){
    var qa=parseAmt(val('amt')),qn=val('note').trim();
    if(!(qa>0)){fail('expErr','আগে টাকার অঙ্ক লিখুন, তারপর দ্রুত তালিকায় রাখুন।','amt');return;}
    var dup=S.quick.some(function(x){return x.amount===qa&&x.cat===selCat&&(x.note||'')===qn;});
    if(dup){showToast('এটা আগেই তালিকায় আছে');return;}
    if(S.quick.length>=12){showToast('দ্রুত তালিকায় সর্বোচ্চ ১২টা রাখা যায়। খাত ও দ্রুত খরচ পাতা থেকে মুছে নিন।');return;}
    S.quick.push({id:uid(),amount:qa,cat:selCat,note:qn});save();
    document.getElementById('quickBox').innerHTML=quickHtml();showToast('দ্রুত তালিকায় রাখা হয়েছে');
  }
  else if(act==='share-report'){var rt=reportText();shareText(rt,'হাতখরচ রিপোর্ট',function(ok){if(ok===false)copyText(rt,'রিপোর্ট কপি হয়েছে','রিপোর্ট');});}

document.addEventListener('input',function(ev){

function limitMsg(tk,catId,isBig){
  var pre=periodOf(tk),a=dayAllowance(tk),d=daySpend(tk),cap=allowCap(a),m=tot(limitList(inRange(S.expenses,pre)));
  if(skipCat(catId))return 'খরচ যোগ হয়েছে (এই খাত লিমিটে ধরা হয় না)';
  if(S.limits.monthly&&m>S.limits.monthly)return 'এই মাসের লিমিট ছাড়িয়ে গেছে';
  if(!isBig&&a&&d>cap)return 'আজকের সীমা ছাড়িয়ে গেছে';
  var cl=+S.limits.cats[catId]||0;
  if(cl&&tot(inRange(S.expenses,pre).filter(function(e){return e.cat===catId;}))>cl)return catById(catId).n+' খাতের সীমা ছাড়িয়ে গেছে';
  if(!isBig&&a&&cap>0&&d>=cap*0.8)return 'আজকের সীমার কাছে পৌঁছে গেছেন';
  return isBig?'বড় খরচ যোগ হয়েছে, আজকের সীমায় ধরা হবে না':'খরচ যোগ হয়েছে';
}

document.addEventListener('submit',function(ev){
  ev.preventDefault();
  var f=ev.target,a,dk,id=f.id;
  if(id==='expForm'){
    a=parseAmt(val('amt'));
    if(!(a>0)){fail('expErr','সঠিক টাকার অঙ্ক লিখুন, যেমন ২০ বা 20।','amt');return;}
    dk=val('edate');if(!validDate(dk))dk=todayKey();
    lastWal=val('ewal')||lastWal;
    var ex={id:uid(),date:dk,amount:a,cat:selCat,note:val('note').trim(),t:dateToT(dk),wallet:lastWal};
    if(selBig)ex.big=true;
    S.expenses.push(ex);
    var wasBig=selBig;selBig=false;
    save();render(false);showToast(limitToast(dk,selCat,wasBig));
    var n1=document.getElementById('amt');if(n1)n1.focus();
  }
  else if(id==='remForm'){
    var tv=val('rtime'),rm=document.getElementById('remMsg');
    if(/^\d\d:\d\d$/.test(tv)){S.settings.rem.time=tv;save();if(S.settings.rem.on)syncReminders();rm.textContent='সময় সংরক্ষণ হয়েছে।';rm.style.color='var(--accent)';}
    else{rm.textContent='সময় বেছে নিন।';rm.style.color='var(--danger)';}
  }
  else if(id==='editForm'){
    if(editKind!=='exp'){submitEditOther();return;}
    a=parseAmt(val('eamt'));
    if(!(a>0)){fail('editErr','সঠিক টাকার অঙ্ক লিখুন।','eamt');return;}
    var ee=null;S.expenses.forEach(function(x){if(String(x.id)===editId)ee=x;});
    if(!ee){document.getElementById('editSheet').hidden=true;return;}
    var snapE=snapshot();
    dk=val('edt');if(!validDate(dk))dk=ee.date;
    if(dk!==ee.date){ee.date=dk;ee.t=dateToT(dk);}
    ee.amount=a;ee.cat=val('ecat')||ee.cat;ee.note=val('enote').trim();ee.wallet=val('ewl')||ee.wallet;
    if(editBig)ee.big=true;else delete ee.big;
    document.getElementById('editSheet').hidden=true;editId=null;
    save();render(false);showToast('ঠিক করা হয়েছে','ফিরিয়ে আনুন',function(){restoreSnap(snapE);});
  }
  else if(id==='saveTransferForm'){
    var sf=val('stfrom');a=parseAmt(val('stamt'));
    if(sf==='savings'){fail('stErr','সঞ্চয় অ্যাকাউন্ট থেকে টাকা পাঠাতে সাধারণ “টাকা সরান” ফর্ম ব্যবহার করুন।','stfrom');return;}
    if(!(a>0)){fail('stErr','সঠিক টাকার অঙ্ক লিখুন।','stamt');return;}
    dk=val('stdate');if(!validDate(dk))dk=todayKey();
    S.transfers.push({id:uid(),date:dk,amount:a,from:sf,to:'savings',t:dateToT(dk)});
    save();render(false);showToast(walName(sf)+' থেকে সঞ্চয়ে '+taka(a)+' পাঠানো হয়েছে');
  }
  else if(id==='recForm'){
    var rw=val('rcw'),rraw=val('rcamt').trim(),ra=parseAmt(rraw);
    if(rraw===''||!isFinite(ra)||ra<0){fail('recErr','আসলে কত টাকা আছে লিখুন (০ হলে ০ লিখুন)।','rcamt');return;}
    var rd=ra-walBal(rw);
    if(Math.abs(rd)<0.5){fail('recErr','হিসাব আগে থেকেই মিলে আছে।','rcamt');return;}
    var snapC=snapshot(),rtk=todayKey();
    if(rd<0)S.expenses.push({id:uid(),date:rtk,amount:-rd,cat:'other',note:'হিসাব মিলানো · '+walName(rw),t:Date.now(),wallet:rw,adj:true});
    else S.income.push({id:uid(),date:rtk,amount:rd,source:'other',note:'হিসাব মিলানো · '+walName(rw),t:Date.now(),wallet:rw,adj:true});
    save();render(false);showToast(walName(rw)+' মিলে গেছে','ফিরিয়ে আনুন',function(){restoreSnap(snapC);});
  }
  else if(id==='trForm'){
    var tf=val('trf'),tt=val('trt');a=parseAmt(val('tramt'));
    if(tf===tt){fail('trErr','দুটো আলাদা ওয়ালেট বেছে নিন।','trt');return;}
    if(!(a>0)){fail('trErr','সঠিক টাকার অঙ্ক লিখুন।','tramt');return;}
    dk=val('trd');if(!validDate(dk))dk=todayKey();
    S.transfers.push({id:uid(),date:dk,amount:a,from:tf,to:tt,t:dateToT(dk)});
    save();render(false);showToast(walName(tf)+' থেকে '+walName(tt)+'-এ '+taka(a)+' সরানো হয়েছে');
  }
  else if(id==='catForm'){
    var cn=val('cname').trim();
    if(!cn){fail('catErr','খাতের নাম লিখুন।','cname');return;}
    if(allCats().some(function(c){return c.n===cn;})){fail('catErr','এই নামে খাত আগেই আছে।','cname');return;}
    if(S.cats.length>=12){fail('catErr','সর্বোচ্চ ১২টা নিজের খাত রাখা যায়।','cname');return;}
    var pal=['--c3','--c5','--c6','--c7','--c9','--c10','--c11','--c1','--c2','--c4','--c8','--c3'];
    S.cats.push({id:'u'+uid(),n:cn,v:pal[S.cats.length]});
    save();render(false);showToast('খাত যোগ হয়েছে');
  }
  else if(id==='quickForm'){
    a=parseAmt(val('qamt'));
    if(!(a>0)){fail('qErr','সঠিক টাকার অঙ্ক লিখুন।','qamt');return;}
    if(S.quick.length>=12){fail('qErr','সর্বোচ্চ ১২টা রাখা যায়। আগেরগুলো থেকে মুছে নিন।','qamt');return;}
    S.quick.push({id:uid(),amount:a,cat:val('qcat')||'other',note:val('qnote').trim()});
    save();render(false);showToast('দ্রুত খরচ যোগ হয়েছে');
  }
  else if(id==='leftForm'){
    var lpre=f.getAttribute('data-pre');a=parseAmt(val('lamt'));
    if(!(a>0)){fail('leftErr','সঠিক টাকার অঙ্ক লিখুন।','lamt');return;}
    var lg=val('lgoal');
    if(!lg){fail('leftErr','লক্ষ্য বেছে নিন।','lgoal');return;}
    var lday=pEnd(lpre);if(lday>todayKey())lday=todayKey();
    lastWal=val('lwal')||lastWal;
    S.savings.push({id:uid(),date:lday,amount:a,goalId:lg,wallet:lastWal,t:dateToT(lday)});
    S.settings.leftDone=lpre;save();render(false);showToast('বাঁচা টাকা সঞ্চয়ে জমা হয়েছে');
  }
  else if(id==='incForm'){
    a=parseAmt(val('iamt'));
    if(!(a>0)){fail('incErr','সঠিক টাকার অঙ্ক লিখুন, যেমন ২৭০০০ বা 27000।','iamt');return;}
    dk=val('idate');if(!validDate(dk))dk=todayKey();
    lastWal=val('iwal')||lastWal;
    S.income.push({id:uid(),date:dk,amount:a,source:selSrc,note:val('inote').trim(),wallet:lastWal,t:dateToT(dk)});
    if(selSrc==='salary'&&alloc.sal===null){alloc.sal=null;}
    save();render(false);showToast(selSrc==='salary'?'বেতন যোগ হয়েছে। নিচে বরাদ্দের হিসাব দেখুন।':'আয় যোগ হয়েছে');
  }
  else if(id==='fixForm'){
    var name=val('fname').trim(),fq=val('ffreq'),day=parseInt(toEn(val('fday')),10);a=parseAmt(val('famt'));
    var ftot=parseInt(toEn(val('ftotal')),10)||0,fdn=parseInt(toEn(val('fdone')),10)||0;
    if(!name){fail('fixErr','নাম লিখুন।','fname');return;}
    if(!(a>0)){fail('fixErr','সঠিক টাকার অঙ্ক লিখুন।','famt');return;}
    if(fq!=='w'&&!(day>=1&&day<=31)){fail('fixErr','মাসিক খরচের তারিখ ১ থেকে ৩১-এর মধ্যে হতে হবে।','fday');return;}
    if(ftot<0||fdn<0||(ftot>0&&fdn>=ftot)){fail('fixErr','আগে দেওয়া কিস্তির সংখ্যা মোট কিস্তির চেয়ে কম হতে হবে।','fdone');return;}
    var n=new Date(),startM=day<n.getDate()?monthKey(n.getFullYear(),n.getMonth()+1):monthKey(n.getFullYear(),n.getMonth());
    lastWal=val('fwal')||lastWal;
    var fo={id:uid(),name:name,amount:a,day:day>=1?day:1,cat:val('fcat')||'other',wallet:lastWal,active:true,start:startM};
    if(fq==='w'){fo.wd=+val('fwd');fo.startD=todayKey();}
    if(ftot>0){fo.total=ftot;fo.done0=fdn;}
    S.fixed.push(fo);
    save();render(false);showToast('নির্ধারিত খরচ যোগ হয়েছে');
  }
  else if(id==='goalForm'){
    var gn=val('gname').trim(),gt=parseAmt(val('gtar'));
    if(!gn){fail('goalErr','লক্ষ্যের নাম লিখুন।','gname');return;}

  else if(f.classList.contains('goalPay')){

    var ws=document.getElementById('gw-'+gid);lastWal=ws?ws.value:lastWal;
    S.savings.push({id:uid(),date:todayKey(),amount:a,goalId:gid,wallet:lastWal,t:Date.now()});
    save();render(false);showToast('সঞ্চয় জমা হয়েছে');
  }
  else if(id==='debtForm'){
    var pn=val('dperson').trim();a=parseAmt(val('damt'));
    if(!pn){fail('debtErr','কার সাথে হিসাব, নাম লিখুন।','dperson');return;}

  else if(id==='limForm'){

  else if(id==='walForm'){

    save();var wm=document.getElementById('walMsg');wm.textContent='সংরক্ষণ হয়েছে।';wm.style.color='var(--accent)';
  }
  else if(id==='calForm'){
    var sd=parseInt(toEn(val('sday')),10),cdv=parseInt(toEn(val('cday')),10);
    S.settings.salaryDay=(sd>=1&&sd<=31)?sd:0;
    S.settings.cycleDay=(cdv>=2&&cdv<=28)?cdv:1;
    mRef=pRef(curPre());save();render(false);showToast('সংরক্ষণ হয়েছে');
  }
  else if(id==='pinForm'){
    var pv=toEn(val('pinNew'));
    if(!/^\d{4,6}$/.test(pv)){fail('pinMsg','পিন ৪ থেকে ৬ সংখ্যার হতে হবে।','pinNew');return;}
    S.settings.pin=hashPin(pv);save();render(false);showToast('পিন চালু হয়েছে');
  }
  else if(id==='restoreForm'){
    var txt=val('rtext').trim(),o;
    try{o=JSON.parse(txt);}catch(e){o=null;}
    var d=o&&o.app==='hatkhoroch'&&o.data?o.data:null;
    if(!d||!Array.isArray(d.expenses)){fail('restoreMsg','এটা সঠিক ব্যাকআপ নয়। কপি করা পুরো লেখাটা পেস্ট করুন।','rtext');return;}
    var snap2=snapshot(),pin2=S.settings.pin;
    S=defState();adopt(d);S.settings.pin=pin2;save();render(false);
    showToast('ব্যাকআপ ফিরে এসেছে','আগের অবস্থায় যান',function(){restoreSnap(snap2);});
  }
  else if(id==='lockForm'){
    var lp=toEn(document.getElementById('lockPin').value);
    if(hashPin(lp)===S.settings.pin){document.getElementById('lock').hidden=true;document.getElementById('lockPin').value='';document.getElementById('lockErr').textContent='';}
    else{var le=document.getElementById('lockErr');le.textContent='পিন মেলেনি, আবার চেষ্টা করুন।';le.style.color='var(--danger)';}
  }
});

document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t&&t.id==='rfile'&&t.files&&t.files[0]){
    var rd=new FileReader();
    rd.onload=function(){
      var tx=document.getElementById('rtext');if(tx)tx.value=String(rd.result||'');
      var m=document.getElementById('restoreMsg');if(m){m.textContent='ফাইল পড়া হয়েছে। নিচে "ফিরিয়ে আনুন" চাপুন।';m.style.color='var(--accent)';}
    };
    rd.readAsText(t.files[0]);
  }
});
document.addEventListener('input',function(ev){
  if(ev.target&&ev.target.id==='allSearch'){
    allQ=ev.target.value||'';
    var box=document.getElementById('allList');
    if(box)box.innerHTML=allListHtml(monthKey(mRef.y,mRef.m));
  }
});
function recOut(){
  var o=document.getElementById('recOut');if(!o)return;
  var raw=val('rcamt').trim(),w=val('rcw');
  if(raw===''||!isFinite(parseAmt(raw))){o.textContent='';return;}
  var cur=walBal(w),d=parseAmt(raw)-cur;
  o.textContent='অ্যাপে এখন '+taka(cur)+'। আপনি লিখেছেন '+taka(parseAmt(raw))+'। '+(Math.abs(d)<0.5?'হিসাব মিলে গেছে।':'ফারাক '+taka(Math.abs(d))+(d<0?' কম, খরচ হিসেবে লেখা হবে।':' বেশি, আয় হিসেবে লেখা হবে।'));
}
document.addEventListener('input',function(ev){
  var t=ev.target;if(!t||!t.id)return;
  if(t.id==='note'){
    var box=document.getElementById('sugBox');if(!box)return;
    box.innerHTML=sugHtml(t.value);
    var k=t.value.trim().toLowerCase(),ex=null;
    sugList.forEach(function(o){if(o.note.toLowerCase()===k)ex=o;});
    if(ex){
      selCat=ex.cat;
      document.querySelectorAll('[data-cat]').forEach(function(c){c.setAttribute('aria-pressed',c.getAttribute('data-cat')===selCat);});
      var ae=document.getElementById('amt');if(ae&&!ae.value.trim())ae.value=String(ex.amt);
    }
  }
  else if(t.id==='rcamt')recOut();
});
document.addEventListener('change',function(ev){if(ev.target&&ev.target.id==='rcw')recOut();});
function bioReady(cb){
  if(!isNative()){cb(false);return;}
  var B=plug('NativeBiometric');if(!B||!B.isAvailable){cb(false);return;}
  try{B.isAvailable({useFallback:false}).then(function(r){cb(!!(r&&r.isAvailable));},function(){cb(false);});}catch(e){cb(false);}
}
function bioAuth(cb){
  var B=plug('NativeBiometric');if(!B){cb(false);return;}
  try{B.verifyIdentity({reason:'হাতখরচ খুলতে আঙুলের ছাপ দিন',title:'হাতখরচ',subtitle:'পরিচয় যাচাই',useFallback:false,maxAttempts:3}).then(function(){cb(true);},function(){cb(false);});}catch(e){cb(false);}
}
function unlockApp(){
  document.getElementById('lock').hidden=true;
  var lp=document.getElementById('lockPin');if(lp)lp.value='';
  var le=document.getElementById('lockErr');if(le)le.textContent='';
}
function hashPin(p){var h=5381,s=String(p)+'|hk';for(var i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))|0;}return String(h);}
var hiddenAt=0;
function lockNow(){
  if(!S.settings.pin)return;
  document.getElementById('lock').hidden=false;
  var bb=document.getElementById('lockBio');if(bb)bb.hidden=true;
  if(S.settings.bio){
    bioReady(function(ok){
      if(!ok)return;
      if(bb)bb.hidden=false;
      bioAuth(function(good){if(good)unlockApp();});
    });
  }
  setTimeout(function(){var x=document.getElementById('lockPin');if(x&&!S.settings.bio)x.focus();},50);
}
document.addEventListener('visibilitychange',function(){
  if(document.hidden){hiddenAt=Date.now();}
  else if(hiddenAt&&Date.now()-hiddenAt>60000){lockNow();}
});

render(false);
lockNow();
if(isNative()&&S.settings.rem.on)syncReminders();
})();
</script>
</body>
</html>
