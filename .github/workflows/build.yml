name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Capacitor project
        run: |
          mkdir www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/share@6 @capacitor/filesystem@6 @capacitor/local-notifications@6
          npx cap init Hatkhoroch com.prodip.hatkhoroch --web-dir www
          npx cap add android
          npx cap sync android

      - name: Allow notifications on Android 13+
        run: |
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p,encoding='utf-8').read()
          if 'POST_NOTIFICATIONS' not in s:
              s=s.replace('</manifest>','    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>')
          open(p,'w',encoding='utf-8').write(s)
          PY

      - name: Set Bengali app name
        run: |
          python3 - <<'PY'
          import re
          p='android/app/src/main/res/values/strings.xml'
          s=open(p,encoding='utf-8').read()
          s=re.sub(r'(<string name="app_name">)[^<]*(</string>)',r'\1হাতখরচ\2',s)
          s=re.sub(r'(<string name="title_activity_main">)[^<]*(</string>)',r'\1হাতখরচ\2',s)
          open(p,'w',encoding='utf-8').write(s)
          PY

      - name: Use fixed signing key (so every update installs over the old app)
        env:
          HK_KEYSTORE: 
        run: |
          mkdir -p ~/.android
          echo "$HK_KEYSTORE" | base64 -d > ~/.android/debug.keystore

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: hatkhoroch-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
