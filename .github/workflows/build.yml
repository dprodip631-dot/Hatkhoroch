name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Capacitor project
        run: |
          mkdir www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init Hatkhoroch com.prodip.hatkhoroch --web-dir www
          npx cap add android
          npx cap sync android

      - name: Set Bengali app name
        run: |
          python3 - <<'PY'
          import re
          p='android/app/src/main/res/values/strings.xml'
          s=open(p,encoding='utf-8').read()
          s=re.sub(r'(<string name="app_name">)[^<]*(</string>)',r'\1হাতখরচ\2',s)
          s=re.sub(r'(<string name="title_activity_main">)[^<]*(</string>)',r'\1হাতখরচ\2',s)
          open(p,'w',encoding='utf-8').write(s)
          PY

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: hatkhoroch-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
