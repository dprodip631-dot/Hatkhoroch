name: Build Hatkhoroch Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Capacitor Android project
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/share@6 @capacitor/filesystem@6 @capacitor/local-notifications@6
          npx cap init Hatkhoroch com.prodip.hatkhoroch --web-dir www
          npx cap add android
          npx cap sync android

      - name: Configure Android permissions and Bengali app name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          permissions = [
              'android.permission.INTERNET',
              'android.permission.POST_NOTIFICATIONS',
          ]
          for permission in permissions:
              line = f'    <uses-permission android:name="{permission}" />'
              if permission not in text:
                  text = text.replace('</manifest>', line + '\n</manifest>')
          manifest.write_text(text, encoding='utf-8')

          strings = Path('android/app/src/main/res/values/strings.xml')
          text = strings.read_text(encoding='utf-8')
          text = re.sub(r'(<string name="app_name">)[^<]*(</string>)', r'\1হাতখরচ\2', text)
          text = re.sub(r'(<string name="title_activity_main">)[^<]*(</string>)', r'\1হাতখরচ\2', text)
          strings.write_text(text, encoding='utf-8')
          PY

      # Keep the same signing key between releases by storing the existing
      # keystore as the repository Actions secret HK_KEYSTORE_BASE64.
      # If the secret is absent, a fresh debug key is created; that APK may not
      # install as an update over an APK signed with a previous key.
      - name: Restore stable debug signing key
        env:
          HK_KEYSTORE_BASE64: ${{ secrets.HK_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$HK_KEYSTORE_BASE64" ]; then
            printf '%s' "$HK_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore
            echo "Using repository signing key."
          else
            echo "::warning::HK_KEYSTORE_BASE64 is not configured. Creating a new debug key; this APK may not update an older installation."
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hatkhoroch-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
